name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk TarifRadar.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TarifRadar-apk
          path: TarifRadar.apk

      - name: Publish to Releases (удобно скачать с телефона)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Тариф-радар, сборка ${{ github.run_number }}
          files: TarifRadar.apk
